version: 2
updates:
  # The postgres:18-alpine base: Dependabot bumps the tag and manifest digest together. A bump is
  # a new release (v18.<minor>.<revision+1>, or v18.<new minor>.0); deployment and homelab then
  # review and pin the published digest. Stay on 18-alpine: a major or a glibc base is a migration.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
      docker-version:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, github-actions]
    open-pull-requests-limit: 5
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-version:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, python]
    open-pull-requests-limit: 5
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
      pip-version:
        applies-to: version-updates
        patterns: ["*"]
