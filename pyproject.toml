[project]
name = "groovemap-postgres"
version = "18.6.0"
description = "GrooveMap's PostgreSQL image: official postgres:18-alpine plus pgvector"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pip-licenses>=5.5.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.ruff]
line-length = 150
target-version = "py314"

[tool.ruff.lint]
select = ["ARG", "B", "C4", "E", "F", "I", "PLC", "PTH", "RUF", "S", "SIM", "T20", "TCH", "UP", "W"]
ignore = ["E501", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["image_inputs"]
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLC"]
"scripts/*.py" = ["T201"]

[tool.mypy]
python_version = "3.14"
files = ["scripts", "tests"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --tb=short"
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.coverage.run]
source = ["scripts"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
